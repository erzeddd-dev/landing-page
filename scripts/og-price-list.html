<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <!--
    Mobile-first OG 1200×630 → di X HP ~380px (scale ≈ 0.32)
    Target di HP:
      - angka harga ~40px+  → design 120–128px
      - nama paket ~14px+   → design 44px
      - baris jasa ~14px+   → design 42–44px
    Psikologi:
      1) Angka harga = visual hero (decision trigger)
      2) 3 opsi + highlight tengah (compromise / best-value bias)
      3) "Mulai" turunkan friction harga
      4) 1 baris jasa = complete offer, scannable
      5) Minim kata, kontras putih di dark brand
  -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Outfit:wght@700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: Inter, system-ui, sans-serif;
      color: #fff;
      background: #09070f;
    }

    .canvas {
      width: 1200px;
      height: 630px;
      /* BAWAH ~100px kosong: napas sebelum title/domain di luar gambar (X/DC) */
      padding: 32px 44px 100px;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 75% 65% at 100% 0%, rgba(138, 43, 226, 0.42), transparent 55%),
        radial-gradient(ellipse 55% 45% at 0% 80%, rgba(255, 0, 127, 0.22), transparent 50%),
        #0b0818;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .brand {
      font-family: Outfit, Inter, sans-serif;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .brand span {
      font-size: 24px;
      font-weight: 600;
      color: #94a3b8;
      margin-left: 12px;
      letter-spacing: -0.01em;
    }

    .domain {
      font-size: 24px;
      font-weight: 700;
      color: #64748b;
    }

    /* Satu baris jasa: font besar, bukan chip kecil */
    .services {
      font-size: 26px;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 0.01em;
      line-height: 1.3;
      margin-bottom: 18px;
      padding: 12px 18px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .services .sep {
      color: #64748b;
      font-weight: 600;
      margin: 0 10px;
    }

    .services .core {
      color: #67e8f9;
    }

    .services .extra {
      color: #e9d5ff;
    }

    .tiers {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      flex: 1;
      min-height: 0;
      /* jangan sampai konten “nempel” ke safe zone bawah */
      max-height: 380px;
    }

    .tier {
      border-radius: 20px;
      padding: 18px 18px 16px;
      border: 2px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.045);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .tier::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
    }

    .basic::before { background: linear-gradient(90deg, #818cf8, #22d3ee); }
    .ngebut::before { background: linear-gradient(90deg, #8a2be2, #ff007f 55%, #00ffff); }
    .lulus::before { background: linear-gradient(90deg, #34d399, #14b8a6); }

    .ngebut {
      border-color: rgba(255, 0, 127, 0.6);
      background: linear-gradient(165deg, rgba(255, 0, 127, 0.22) 0%, rgba(138, 43, 226, 0.14) 45%, rgba(255,255,255,0.03) 100%);
      box-shadow: 0 16px 48px rgba(255, 0, 127, 0.2);
    }

    .badge {
      align-self: flex-start;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(90deg, #ff007f, #8a2be2);
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .badge-slot {
      height: 34px;
      margin-bottom: 10px;
    }

    .name {
      font-family: Outfit, Inter, sans-serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .mulai {
      font-size: 18px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 2px;
    }

    .price-row {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      margin: 2px 0 0;
    }

    .rp {
      font-size: 26px;
      font-weight: 700;
      color: #94a3b8;
      line-height: 1;
      padding-bottom: 12px;
    }

    .num {
      font-family: Outfit, Inter, sans-serif;
      font-size: 100px;
      font-weight: 800;
      letter-spacing: -0.055em;
      line-height: 0.88;
      color: #fff;
    }

    .unit {
      font-size: 32px;
      font-weight: 800;
      color: #94a3b8;
      line-height: 1;
      padding-bottom: 12px;
      margin-left: 2px;
    }

    .hint {
      margin-top: auto;
      padding-top: 12px;
      font-size: 22px;
      font-weight: 600;
      color: #cbd5e1;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .ngebut .hint { color: #fce7f3; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="header">
      <div class="brand">OlahData<span>Price list</span></div>
      <div class="domain">olahdata.me</div>
    </div>

    <!-- Semua jasa tetap: core (cyan) + pendukung (ungu) -->
    <div class="services">
      <span class="core">SPSS</span><span class="sep">·</span>
      <span class="core">EViews</span><span class="sep">·</span>
      <span class="core">STATA</span><span class="sep">·</span>
      <span class="core">SmartPLS</span><span class="sep">·</span>
      <span class="extra">Ekonometrika</span><span class="sep">·</span>
      <span class="extra">Parafrase</span><span class="sep">·</span>
      <span class="extra">Proofreading</span><span class="sep">·</span>
      <span class="extra">Jurnal</span>
    </div>

    <div class="tiers">
      <div class="tier basic">
        <div class="badge-slot"></div>
        <div class="name">Basic</div>
        <div class="mulai">Mulai</div>
        <div class="price-row">
          <span class="rp">Rp</span>
          <span class="num">250</span>
          <span class="unit">rb</span>
        </div>
        <div class="hint">5–7 hari · deskriptif</div>
      </div>

      <div class="tier ngebut">
        <div class="badge">★ Paling dipilih</div>
        <div class="name">Ngebut</div>
        <div class="mulai">Mulai</div>
        <div class="price-row">
          <span class="rp">Rp</span>
          <span class="num">450</span>
          <span class="unit">rb</span>
        </div>
        <div class="hint">1–3 hari · prioritas</div>
      </div>

      <div class="tier lulus">
        <div class="badge-slot"></div>
        <div class="name">Lulus Aman</div>
        <div class="mulai">Mulai</div>
        <div class="price-row">
          <span class="rp">Rp</span>
          <span class="num">750</span>
          <span class="unit">rb</span>
        </div>
        <div class="hint">Full · siap sidang</div>
      </div>
    </div>
  </div>
</body>
</html>
